; Throwaway probe: does IRremoteESP8266's GPIO receiver work on StickS3 G42?
[env:irprobe]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified @ ^0.3.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
