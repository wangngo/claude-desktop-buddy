[platformio]
; `pio run` / tools/flash_character.py target this env unless -e is given.
default_envs = m5sticks3

[common]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.3.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; M5StickS3: ESP32-S3-PICO-1 (8MB flash), M5PM1 PMIC, BMI270, RX8130 RTC.
[env:m5sticks3]
extends = common
platform = espressif32
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi   ; 8MB octal PSRAM (vendor config)
lib_deps =
    ${common.lib_deps}
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; IR TX = G46 (vendor pin map), powered from EXT_5V. Only Daikin senders
    ; are compiled in (keeps flash small); no decoders (RX is unusable).
    -DBUDDY_IR_TX=46
    -D_IR_ENABLE_DEFAULT_=false
    -DSEND_DAIKIN=true -DSEND_DAIKIN2=true -DSEND_DAIKIN64=true
    -DSEND_DAIKIN128=true -DSEND_DAIKIN152=true -DSEND_DAIKIN160=true
    -DSEND_DAIKIN176=true -DSEND_DAIKIN200=true -DSEND_DAIKIN216=true
    -DSEND_DAIKIN312=true

; Original target, now also built through M5Unified.
[env:m5stickc-plus]
extends = common
platform = espressif32
board = m5stick-c
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
